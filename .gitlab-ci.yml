# =============================================================================
# TrastCMS — GitLab CI/CD Pipeline
# Migrado y armonizado desde GitHub Actions
# =============================================================================

stages:
  - test
  - build
  - native
  - docker
  - release

default:
  interruptible: true

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss:SSS"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository
    - frontend/node_modules

# ─────────────────────────────────────────────────────────────────────────────
# 1. Pruebas y verificación del proyecto (Backend Java + Frontend Vue)
# ─────────────────────────────────────────────────────────────────────────────
test:
  stage: test
  image: ghcr.io/graalvm/graalvm-community:25
  before_script:
    - microdnf install -y nodejs npm git findutils
    - chmod +x ./mvnw
    - java --version
    - node --version
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean verify -DskipTests
  artifacts:
    expire_in: 7 days
    paths:
      - target/trastcms-*.jar
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/failsafe-reports/TEST-*.xml"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ─────────────────────────────────────────────────────────────────────────────
# 2. Empaquetado del archivo JAR ejecutable
# ─────────────────────────────────────────────────────────────────────────────
package-jar:
  stage: build
  image: ghcr.io/graalvm/graalvm-community:25
  before_script:
    - microdnf install -y nodejs npm git
    - chmod +x ./mvnw
  script:
    - ./mvnw $MAVEN_CLI_OPTS clean package -DskipTests
    - mkdir -p release
    - cp target/trastcms-*.jar release/
  artifacts:
    name: "trastcms-jar-${CI_COMMIT_REF_SLUG}"
    expire_in: 14 days
    paths:
      - release/trastcms-*.jar
      - target/trastcms-*.jar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ─────────────────────────────────────────────────────────────────────────────
# 3. Compilación del ejecutable Nativo con GraalVM (Linux x64)
# ─────────────────────────────────────────────────────────────────────────────
build-native:
  stage: native
  image: ghcr.io/graalvm/native-image-community:25
  before_script:
    - microdnf install -y nodejs npm git gcc gcc-c++ glibc-devel zlib-devel findutils
    - chmod +x ./mvnw ./scripts/build-native.sh
  script:
    - ./scripts/build-native.sh --skip-tests
    - mkdir -p release dist
    - EXECUTABLE=$(find target -maxdepth 1 -type f -name 'trastcms-*' ! -name '*.jar' | head -n 1)
    - cp "$EXECUTABLE" "release/trastcms-linux-x64"
    - cp "$EXECUTABLE" "dist/trastcms-linux-x64"
  artifacts:
    name: "trastcms-native-linux-${CI_COMMIT_REF_SLUG}"
    expire_in: 30 days
    paths:
      - release/trastcms-linux-x64
      - dist/trastcms-linux-x64
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# ─────────────────────────────────────────────────────────────────────────────
# 4. Construcción y publicación de la imagen Docker en GitLab Container Registry
# ─────────────────────────────────────────────────────────────────────────────
docker-build:
  stage: docker
  image: docker:27-cli
  services:
    - docker:27-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_NAME="$CI_COMMIT_TAG"
      else
        TAG_NAME="$CI_COMMIT_REF_SLUG"
      fi
    - docker build -t "$CI_REGISTRY_IMAGE:$TAG_NAME" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG_NAME"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ─────────────────────────────────────────────────────────────────────────────
# 5. Publicación de versión en GitLab Releases (Tag v*)
# ─────────────────────────────────────────────────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package-jar
      artifacts: true
    - job: build-native
      artifacts: true
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  script:
    - echo "Creando Release en GitLab para el tag $CI_COMMIT_TAG..."
  release:
    name: "Release $CI_COMMIT_TAG — TrastCMS"
    tag_name: "$CI_COMMIT_TAG"
    description: "Release oficial de TrastCMS $CI_COMMIT_TAG compilado con GraalVM JDK 25."
    assets:
      links:
        - name: "JAR Ejecutable (Java 21+ / GraalVM 25)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/trastcms-3.2.0.jar?job=package-jar"
        - name: "Binario Nativo Linux x64 (GraalVM)"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/release/trastcms-linux-x64?job=build-native"
